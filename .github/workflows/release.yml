name: Release ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --prefix "${{ runner.temp }}/spy-copilot" --ignore-scripts --no-audit --no-fund @github/copilot@1.0.113
      - run: npm run test:cli
        env:
          SPY_COPILOT_CLI: ${{ runner.temp }}/spy-copilot/node_modules/@github/copilot/npm-loader.js
      - run: npm run benchmark
      - run: npm run test:memory
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - run: npm run verify:zip
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Spy $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip reports/BENCHMARKS.md reports/benchmark.json reports/junit.xml reports/browser-junit.xml reports/resources.json reports/memory-soak.json reports/cli-compatibility.json --clobber
